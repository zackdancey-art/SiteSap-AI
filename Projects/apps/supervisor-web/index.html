<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiteSnap Supervisor Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="auth-card" id="auth-card">
        <h1>Supervisor Dashboard</h1>
        <p>Sign in with a supervisor or admin account.</p>
        <label>Email</label>
        <input id="email" type="email" placeholder="supervisor@company.com" />
        <label>Password</label>
        <input id="password" type="password" placeholder="Password" />
        <label>API Base URL</label>
        <input id="api-base" type="text" placeholder="http://localhost:4000" />
        <button id="login-btn">Sign In</button>
        <p id="auth-error" class="error"></p>
      </section>

      <section class="dashboard hidden" id="dashboard">
        <header>
          <div>
            <h1>Supervisor Dashboard</h1>
            <p id="user-meta"></p>
          </div>
          <div class="header-actions">
            <button id="refresh-btn">Refresh</button>
            <button id="logout-btn" class="secondary">Logout</button>
          </div>
        </header>

        <div class="metrics-grid" id="metrics"></div>

        <section class="card">
          <div class="card-header">
            <h2>Site Rollup</h2>
            <button id="export-btn">Export JSON</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Site</th>
                <th>Client</th>
                <th>Status</th>
                <th>Owner</th>
                <th>Entries</th>
                <th>Diaries</th>
                <th>Approved</th>
              </tr>
            </thead>
            <tbody id="site-table"></tbody>
          </table>
        </section>
      </section>
    </main>

    <script>
      const authCard = document.getElementById("auth-card");
      const dashboard = document.getElementById("dashboard");
      const authError = document.getElementById("auth-error");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const baseInput = document.getElementById("api-base");
      const userMeta = document.getElementById("user-meta");
      const metricsContainer = document.getElementById("metrics");
      const siteTable = document.getElementById("site-table");

      const storage = {
        get token() {
          return localStorage.getItem("sitesnap.supervisor.token");
        },
        set token(value) {
          if (!value) localStorage.removeItem("sitesnap.supervisor.token");
          else localStorage.setItem("sitesnap.supervisor.token", value);
        },
        get base() {
          return localStorage.getItem("sitesnap.supervisor.base") || "http://localhost:4000";
        },
        set base(value) {
          localStorage.setItem("sitesnap.supervisor.base", value);
        }
      };

      baseInput.value = storage.base;

      async function request(path, options = {}) {
        const res = await fetch(`${storage.base}/api${path}`, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(storage.token ? { Authorization: `Bearer ${storage.token}` } : {}),
            ...(options.headers || {})
          }
        });
        const text = await res.text();
        const data = text ? JSON.parse(text) : {};
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      }

      function renderMetrics(summary) {
        const metrics = [
          ["Sites", summary.sites],
          ["Entries", summary.entries],
          ["Diaries", summary.diaries],
          ["Approved", summary.approvedDiaries],
          ["Draft", summary.draftDiaries]
        ];
        metricsContainer.innerHTML = metrics
          .map(([label, value]) => `<article class="metric"><h3>${value}</h3><p>${label}</p></article>`)
          .join("");
      }

      function renderTable(report) {
        siteTable.innerHTML = report.perSite
          .map(
            (row) => `
            <tr>
              <td>${row.name}</td>
              <td>${row.client}</td>
              <td>${row.status}</td>
              <td>${row.ownerEmail}</td>
              <td>${row.entries}</td>
              <td>${row.diaries}</td>
              <td>${row.approvedDiaries}</td>
            </tr>
          `
          )
          .join("");
      }

      async function loadDashboard() {
        const [me, summary, report] = await Promise.all([
          request("/auth/me"),
          request("/projects/summary"),
          request("/projects/reports/supervisor")
        ]);
        userMeta.textContent = `${me.user.name} • ${me.user.email} • ${me.user.role}`;
        renderMetrics(summary);
        renderTable(report);
      }

      async function login() {
        authError.textContent = "";
        storage.base = baseInput.value.trim().replace(/\/$/, "");
        try {
          const payload = await request("/auth/login", {
            method: "POST",
            body: JSON.stringify({
              email: emailInput.value.trim(),
              password: passwordInput.value
            })
          });
          storage.token = payload.token;
          await showDashboard();
        } catch (error) {
          authError.textContent = error.message;
        }
      }

      async function showDashboard() {
        try {
          await loadDashboard();
          authCard.classList.add("hidden");
          dashboard.classList.remove("hidden");
        } catch (error) {
          storage.token = "";
          authCard.classList.remove("hidden");
          dashboard.classList.add("hidden");
          authError.textContent = error.message;
        }
      }

      function exportReport() {
        request("/projects/reports/supervisor")
          .then((report) => {
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = `sitesnap-supervisor-report-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            URL.revokeObjectURL(url);
          })
          .catch((error) => {
            alert(error.message);
          });
      }

      document.getElementById("login-btn").addEventListener("click", login);
      document.getElementById("refresh-btn").addEventListener("click", loadDashboard);
      document.getElementById("logout-btn").addEventListener("click", () => {
        storage.token = "";
        authCard.classList.remove("hidden");
        dashboard.classList.add("hidden");
      });
      document.getElementById("export-btn").addEventListener("click", exportReport);

      if (storage.token) {
        showDashboard();
      }
    </script>
  </body>
</html>
