name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build TypeScript projects (references)
        run: pnpm run build:ts

      - name: Typecheck all packages
        run: pnpm -r run typecheck

      - name: Lint code
        run: pnpm run lint

      - name: Build API service
        run: pnpm --filter ./services/api run build

      - name: Run API tests
        run: pnpm --filter ./services/api run test
        env:
          NODE_ENV: test
          AUTH_TOKEN_SECRET: ci-test-secret
