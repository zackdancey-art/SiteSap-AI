name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects

    # Postgres for the DB-gated suites (RLS + store round-trip). Without this the
    # TEST_DATABASE_URL-gated tests SKIP, and column drift between a store's SQL
    # and the schema (e.g. crew_timecards start_time/end_time/break_minutes) would
    # sail through green CI and only 500 in prod — the exact failure this guards.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sitesnap
          POSTGRES_PASSWORD: sitesnap
          POSTGRES_DB: sitesnap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitesnap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('Projects/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # shared emits only .d.ts files; build it first so TypeScript project
      # references resolve correctly in typecheck and test/build steps.
      - name: Build shared types
        run: pnpm --filter ./shared run build:types

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Two separate runs on purpose. TEST_DATABASE_URL must NOT be set for the
      # in-memory suite: some stores (e.g. projectsStore) are test-aware and switch
      # to the DB path whenever TEST_DATABASE_URL is present, which breaks tests
      # that assume the in-memory store. So the in-memory suite runs with it unset
      # (the DB-gated suites register a skip), and the DB suites run separately with
      # it set (test:db targets exactly the files guarded by !TEST_DATABASE_URL).
      - name: Tests (in-memory)
        run: pnpm run test

      - name: Tests (database — RLS + store round-trip)
        run: pnpm --filter services-api run test:db
        env:
          # NODE_ENV=test binds getPgPool() to TEST_DATABASE_URL (never DATABASE_URL).
          # No PG_SSL -> plain local connection to the service container, no TLS.
          TEST_DATABASE_URL: postgres://sitesnap:sitesnap@localhost:5432/sitesnap_test
